# D-001, D-065: every test level runs on each push to dev (work goes straight to dev) and on PRs to
# main. E2E is split into 3 shards; each runner has its own local Supabase, so they run at once.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push contains the older commits, so it replaces their run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Local Supabase DB (supabase/config.toml [db] port); never the cloud project.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Only what the tests use: Postgres, Auth, the REST API (RLS test) and its gateway.
      - name: Start local Supabase
        run: >-
          npx supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta

      - name: Migrate
        run: npx drizzle-kit migrate

      - name: Integration tests
        run: npm run test:int

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Start local Supabase
        run: >-
          npx supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta

      # Before Playwright: it starts the build (which reads the DB) before its global setup.
      - name: Migrate
        run: npx drizzle-kit migrate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Every theme runs here (E2E_THEMES unset).
      - name: E2E tests (shard ${{ matrix.shard }}/3)
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
