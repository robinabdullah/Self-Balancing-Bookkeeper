# Mobile Business Lite behind the VPS's existing nginx (D-030). Install as
# /etc/nginx/sites-available/mobile-business, link it into sites-enabled, then run
# `sudo certbot --nginx -d business.example.com`: certbot adds the HTTPS server and the redirect.
# See deploy/README.md.
server {
    listen 80;
    listen [::]:80;
    server_name business.example.com;

    location / {
        proxy_pass http://127.0.0.1:4005;
        proxy_http_version 1.1;
        # Next.js checks a server action's Origin against these, so they must be the public host.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
